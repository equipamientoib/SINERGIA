# Regenera las páginas de alquiler por tipo (alquiler/…) y el sitemap con los
# datos EN VIVO de la hoja, una vez al día. Si la hoja no cambió, no hace nada.
# También se puede lanzar a mano: pestaña Actions → «Páginas de alquiler» → Run workflow.
name: Páginas de alquiler

on:
  schedule:
    - cron: '0 11 * * *'        # 06:00 en Lima
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: paginas-alquiler
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Traer el catálogo en vivo del Apps Script
        id: vivo
        run: |
          URL=$(grep -oE 'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec' js/00-config.js | head -1)
          CODIGO=$(curl -sSL --retry 3 --max-time 90 -A "Mozilla/5.0 (paginas-alquiler)" \
                   -w '%{http_code}' -o /tmp/vivo.json "$URL" || echo "000")
          echo "HTTP $CODIGO · $(wc -c < /tmp/vivo.json 2>/dev/null || echo 0) bytes"
          # Solo se usa si trae equipos con id y nombre. Si Google responde
          # otra cosa (error, página de acceso), se sigue con el catálogo
          # del repositorio: las páginas no se rompen y el job no falla.
          if python3 -c "import json,sys; d=json.load(open('/tmp/vivo.json')); n=sum(1 for e in d.get('equipos',[]) if e.get('id') and e.get('nom')); print('equipos en vivo:',n); sys.exit(0 if n else 1)"; then
            echo "datos=/tmp/vivo.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::El Apps Script no devolvió el catálogo; se usa data/catalogo.json. Inicio de la respuesta:"
            # Título y texto visible de la página que devolvió Google (suele
            # decir el error del script o que pide iniciar sesión).
            python3 -c "import re,html;t=open('/tmp/vivo.json',errors='ignore').read();m=re.search(r'<title>(.*?)</title>',t,re.S);print('titulo:',html.unescape(m.group(1)).strip() if m else '-');b=re.sub(r'(?s)<(script|style).*?</\\1>','',t);print('texto:',re.sub(r'\\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',b))).strip()[:500])" || true
            echo "datos=data/catalogo.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar páginas
        run: python3 scripts/generar_paginas.py --datos "${{ steps.vivo.outputs.datos }}"

      - name: Publicar si algo cambió
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then echo "Sin cambios."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A alquiler sitemap.xml robots.txt index.html
          git commit -m "Paginas de alquiler al dia con la hoja"
          git push
          # Un push hecho con GITHUB_TOKEN no siempre dispara GitHub Pages:
          # se le pide la publicación explícitamente.
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
